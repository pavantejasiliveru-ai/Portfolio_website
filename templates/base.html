<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal portfolio of Pavan, a Python developer.">
    <title>{% block title %}Pavan | Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>
<body class="{{ theme }}-theme">
    <header class="site-header">
        <nav class="navbar container" aria-label="Main navigation">
            <a class="brand" href="#about">Pavan Teja<span>.</span></a>

            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#education">Education</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>

            <form action="{{ url_for('set_theme') }}" method="post" class="theme-form">
                <button class="theme-toggle" type="submit">
                    Switch to {{ theme_name }} Mode
                </button>
            </form>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>© {{ year }} Pavan. All rights reserved.</p>
    </footer>
</body>
</html>
